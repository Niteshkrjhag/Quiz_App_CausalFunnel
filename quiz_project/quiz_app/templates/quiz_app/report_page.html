{% extends 'quiz_app/base.html' %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/quiz.css">
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Quiz Results</h3>
            </div>
            <div class="card-body">
                <div class="result-summary mb-4">
                    <h4>Quiz Summary</h4>
                    <p>Email: <strong>{{ email }}</strong></p>
                    <p>Score: <strong id="score">{{ result.score }} out of {{ result.total }}</strong></p>
                    <div class="progress mb-3">
                        <div class="progress-bar" role="progressbar" id="score-bar" 
                             style="width: {{ result.score|floatformat:0 }}%;" 
                             aria-valuenow="{{ result.score }}" 
                             aria-valuemin="0" 
                             aria-valuemax="{{ result.total }}">
                            {{ result.score|floatformat:0 }}%
                        </div>
                    </div>
                </div>
                
                <div id="results-container">
                    <!-- Results will be dynamically loaded here -->
                </div>
                
                <div class="text-center mt-4">
                    <a href="{% url 'index' %}" class="btn btn-primary">Take Another Quiz</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/report.js"></script>
{% endblock %}
