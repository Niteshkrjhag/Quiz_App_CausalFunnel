{% extends 'quiz_app/base.html' %}

{% block content %}
<div class="quiz-container">
    <div class="text-center mb-4">
        <h2>Welcome to the Quiz!</h2>
        <p class="lead">Complete 15 questions in 30 minutes to test your knowledge.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title h5 mb-0">New User</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.email.id_for_label }}" class="form-label">Email Address</label>
                            {{ form.email }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Start Quiz</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h3 class="card-title h5 mb-0">Existing User</h3>
                </div>
                <div class="card-body">
                    <p>Already used the quiz application before?</p>
                    <a href="{% url 'login' %}" class="btn btn-success w-100">Login with your Email</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
