{% extends 'quiz_app/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Welcome to the Quiz</h3>
            </div>
            <div class="card-body">
                <p class="card-text">This quiz contains 15 questions and you have 30 minutes to complete it.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.email.id_for_label }}" class="form-label">Email address</label>
                        {{ form.email }}
                        {% if form.email.errors %}
                            <div class="text-danger">
                                {{ form.email.errors }}
                            </div>
                        {% endif %}
                        <div class="form-text">Enter your email to start the quiz.</div>
                    </div>
                    <button type="submit" class="btn btn-primary">Start Quiz</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
